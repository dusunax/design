name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 부품 화면을 바꾼 브랜치는 머지 전에 Actions 탭에서 수동으로 돌려 Chromatic 비교를 본다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # 크기 예산은 리포트만 한다. 넘어도 실패로 처리하지 않는다.
      - run: pnpm size
        continue-on-error: true

  chromatic:
    needs: check
    # main 머지와 수동 실행에서만 돈다. PR 이벤트의 ref(refs/pull/N/merge)는 chromatic Environment의 배포 브랜치 제한을 통과하지 못한다.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: chromatic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TurboSnap(--only-changed)이 바뀐 스토리를 찾으려면 전체 기록이 필요하다.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @dusunax/moa build
      # --build-script-name build: 공개 환경 변수 검사를 거친 빌드만 올린다(SEC-2.1).
      # --auto-accept-changes main: main 빌드를 기준 화면으로 바로 승인한다. 브랜치 빌드는 이 기준과 비교한다.
      - run: pnpm --filter @dusunax/moa-storybook exec chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --build-script-name build --only-changed --exit-zero-on-changes --auto-accept-changes main
